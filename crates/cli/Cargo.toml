[package]
name = "benshi-cli"
description = "The client: speaks to a running daemon over a local socket."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[dependencies]
anyhow = "1.0.104"
benshi-core = { path = "../core" }
benshi-daemon = { path = "../daemon" }
clap = { version = "4.6.7", features = ["derive"] }
serde_json = "1.0.151"
tokio = { version = "1.53.1", features = ["io-util", "macros", "net", "rt", "time"] }

[lints]
workspace = true

[dev-dependencies]
benshi-detect = { path = "../detect" }
tempfile = "3.27.0"
