[package]
name = "benshi-core"
description = "Domain types and pure logic for benshi. No I/O, no platform code."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[lints]
workspace = true

[dependencies]
chardetng = "1.0.0"
encoding_rs = "0.8.41"
serde = { version = "1.0.229", features = ["derive"] }
# The trace file format is JSON Lines, so reading one is parsing JSON. Neither
# this nor `thiserror` is I/O or platform code, which is what this crate is
# forbidden to take on.
serde_json = "1.0.151"
thiserror = "2.0.20"
