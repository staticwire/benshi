[package]
name = "benshi-core"
description = "Domain types and pure logic for benshi. No I/O, no platform code."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[lints]
workspace = true

[dependencies]
# The anime filename parser, a Rust port of erengy/anitomy. Pure Rust with one
# direct runtime dependency, `regex` without its Unicode tables, which brings
# `aho-corasick`, `memchr`, `regex-automata` and `regex-syntax` with it. All of
# them are Rust, so nothing C arrives and this crate stays free of platform
# code. MPL-2.0, the only non-permissive licence in the graph; section 3.3
# permits a Larger Work under other terms, so benshi stays MIT.
anitomy-ng = "1.0.10"
chardetng = "1.0.0"
encoding_rs = "0.8.41"
serde = { version = "1.0.229", features = ["derive"] }
# The trace file format is JSON Lines, so reading one is parsing JSON. Neither
# this nor `thiserror` is I/O or platform code, which is what this crate is
# forbidden to take on.
serde_json = "1.0.151"
thiserror = "2.0.20"
# NFKC for the recognition key, so a full-width title and its ordinary spelling
# meet. Pure Rust, with `tinyvec` as its one dependency.
unicode-normalization = "0.1.25"
