[package]
name = "benshi-detect"
description = "Platform adapters that observe media sources and emit snapshots."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[dependencies]
benshi-core = { path = "../core" }
thiserror = "2.0.20"

# The adapters are built for Linux, the one platform the daemon runs on, and
# their dependencies are gated with them. MPRIS exists only on Linux and zbus
# is needed only to speak to it, so it is not carried into a Windows build
# that will reach the same sources through SMTC instead.
[target.'cfg(target_os = "linux")'.dependencies]
futures-util = { version = "0.3.34", default-features = false, features = ["std"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tokio = { version = "1.53.1", features = ["io-util", "net", "rt", "time"] }
zbus = { version = "5.19.0", default-features = false, features = ["tokio"] }

[lints]
workspace = true

[dev-dependencies]
tempfile = "3.27.0"
tokio = { version = "1.53.1", features = ["rt", "time", "macros", "test-util"] }
