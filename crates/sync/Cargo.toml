[package]
name = "benshi-sync"
description = "List backends and the per-backend operation queue."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[dependencies]
benshi-core = { path = "../core" }
reqwest = { version = "0.13.4", default-features = false, features = ["rustls-no-provider"] }
rustls = { version = "0.23.43", default-features = false, features = ["ring", "std", "tls12"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
thiserror = "2.0.21"
tokio = { version = "1.53.1", features = ["time"] }

[lints]
workspace = true

[dev-dependencies]
tokio = { version = "1.53.1", features = ["io-util", "macros", "net", "rt", "test-util", "time"] }
