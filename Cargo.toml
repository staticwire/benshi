# Dependencies are added with `cargo add` in the crate that needs them, and in
# the task that needs them, so that a recorded version is one that actually
# resolved rather than one written from memory. There is deliberately no
# `[workspace.dependencies]` section: nothing is yet shared by enough crates to
# earn one, and an empty one is removed by `cargo add` without saying so, taking
# any comment on it along.
[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.98"
license = "MIT"
authors = ["staticwire"]
repository = "https://github.com/staticwire/benshi"

[workspace.lints.rust]
missing_docs = "warn"
# `deny`, not `forbid`: the Windows SMTC adapter will need `unsafe` blocks, and
# `forbid` cannot be lifted locally. A crate that needs it opts out explicitly
# with a justification comment.
unsafe_code = "deny"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
# Discarding a Result must be caught by a lint rather than by review.
let_underscore_must_use = "deny"
